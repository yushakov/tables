{% extends 'base.html' %}
{% load static %}

{% block title %}Status management{% endblock %}

{% block extra-head %}

<script type="module" crossorigin src="{% static 'list/status_mgr/script.js' %}"></script>
{% endblock %}

{% block content %}

    </script>
    <div id="root"></div>
{% endblock %}
